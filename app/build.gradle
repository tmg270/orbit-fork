plugins {
    id 'com.android.application'
}

def orbitSigningPropertiesFile = rootProject.file('orbit-signing.properties')
def orbitSigningProperties = new Properties()
if (orbitSigningPropertiesFile.exists()) {
    orbitSigningPropertiesFile.withInputStream { orbitSigningProperties.load(it) }
}

def orbitSigningValue = { String name ->
    def localValue = orbitSigningProperties.getProperty(name)
    localValue != null && !localValue.isEmpty() ? localValue : System.getenv(name)
}

def orbitReleaseStoreFile = orbitSigningValue('ORBIT_RELEASE_STORE_FILE')?.trim()
def orbitReleaseKeyAlias = orbitSigningValue('ORBIT_RELEASE_KEY_ALIAS')?.trim()
def orbitReleaseStorePassword = orbitSigningValue('ORBIT_RELEASE_STORE_PASSWORD')
def orbitReleaseKeyPassword = orbitSigningValue('ORBIT_RELEASE_KEY_PASSWORD')
def orbitReleaseSigningReady = [
        orbitReleaseStoreFile,
        orbitReleaseKeyAlias,
        orbitReleaseStorePassword,
        orbitReleaseKeyPassword
].every { it != null && !it.isEmpty() }

// The Google Play upload key. Deliberately a different set of values from ORBIT_RELEASE_*: the
// release key is the GitHub edition's permanent app-signing identity and signs every GitHub APK.
// Play receives bundles signed with this separate upload key and re-signs them with its own
// Google-generated app signing key, so the Play edition's certificate is intentionally different
// from the GitHub one. The release key is never given to Google. docs/PLAY_STORE.md section 5.
def orbitUploadStoreFile = orbitSigningValue('ORBIT_UPLOAD_STORE_FILE')?.trim()
def orbitUploadKeyAlias = orbitSigningValue('ORBIT_UPLOAD_KEY_ALIAS')?.trim()
def orbitUploadStorePassword = orbitSigningValue('ORBIT_UPLOAD_STORE_PASSWORD')
def orbitUploadKeyPassword = orbitSigningValue('ORBIT_UPLOAD_KEY_PASSWORD')
def orbitUploadSigningReady = [
        orbitUploadStoreFile,
        orbitUploadKeyAlias,
        orbitUploadStorePassword,
        orbitUploadKeyPassword
].every { it != null && !it.isEmpty() }

android {
    namespace 'com.orbit.assistant'
    compileSdk 36

    defaultConfig {
        applicationId 'com.tmg270.orbit'
        minSdk 29
        targetSdk 36
        // GrokLink versioning: CI builds get a rising versionCode (1000 + GitHub run number)
        // so every build installs as an update; local builds fall back to 1000.
        def runNumber = System.getenv('GITHUB_RUN_NUMBER')
        versionCode runNumber ? 1000 + runNumber.toInteger() : 1000
        versionName runNumber ? "1.0.${runNumber}-groklink" : "1.0.0-groklink-local"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        // Stable debug signing for the tmg270 fork, so every CI build installs as an update.
        // CI decodes ci/orbit-debug.keystore.b64 (a DEBUG-ONLY key, public, non-secret password)
        // to app/orbit-debug.keystore. Env vars override; without the file, default debug key.
        def orbitDebugStore = file(System.getenv('ORBIT_DEBUG_STORE_FILE') ?: 'orbit-debug.keystore')
        if (orbitDebugStore.exists()) {
            debug {
                storeFile orbitDebugStore
                storePassword System.getenv('ORBIT_DEBUG_STORE_PASSWORD') ?: 'orbitdebug'
                keyAlias System.getenv('ORBIT_DEBUG_KEY_ALIAS') ?: 'orbitdebug'
                keyPassword System.getenv('ORBIT_DEBUG_KEY_PASSWORD') ?: 'orbitdebug'
            }
        }
        release {
            if (orbitReleaseSigningReady) {
                storeFile file(orbitReleaseStoreFile)
                storePassword orbitReleaseStorePassword
                keyAlias orbitReleaseKeyAlias
                keyPassword orbitReleaseKeyPassword
            }
        }
        playUpload {
            if (orbitUploadSigningReady) {
                storeFile file(orbitUploadStoreFile)
                storePassword orbitUploadStorePassword
                keyAlias orbitUploadKeyAlias
                keyPassword orbitUploadKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (orbitReleaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // The Google Play edition: the same Orbit, the same com.orbit.assistant, the same version,
        // distributed as an App Bundle through Google Play and signed by Google Play with its own
        // key, never the GitHub release key. `gradlew bundlePlay` builds it.
        //
        // A build type rather than product flavors, on purpose. Flavors would rename every
        // existing task and output (assembleRelease, app-release.apk, app-debug.apk) that
        // release.yml, candidate.yml, build-apk.yml and tools/build_groklink.ps1 depend on. A build
        // type leaves the GitHub edition's debug and release variants exactly as they were.
        //
        // Not initWith(release): that would copy the release signing config, and a Play bundle
        // must be signed with the upload key or not at all. Without ORBIT_UPLOAD_* values the
        // bundle is produced unsigned, which Play Console refuses to accept, so nothing unsigned
        // can reach Play by accident.
        play {
            signingConfig orbitUploadSigningReady ? signingConfigs.playUpload : null
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            matchingFallbacks = ['release']
        }
    }

    applicationVariants.all { variant ->
        if (variant.buildType.name == 'debug') {
            variant.outputs.all { outputFileName = "GrokLink-${variant.versionName}-debug.apk" }
        }
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        // The distribution boundary. src/github holds the only code able to fetch Orbit APKs from
        // GitHub Releases and hand an APK to Android's package installer; both GitHub variants
        // compile it. The play build type compiles src/play instead, whose OrbitEdition has the
        // same shape and refuses everything, so the Play bundle does not contain a self-update or
        // external-install path at all rather than containing one that is switched off.
        debug.java.srcDirs += ['src/github/java']
        release.java.srcDirs += ['src/github/java']
    }

    testOptions {
        unitTests.includeAndroidResources = true
        // Robolectric suites of 9k+ tests, including real bitmap decoding for Rich Answers, ran
        // out of Gradle's default 512 MB test heap intermittently. Give the test JVM explicit
        // headroom so a passing test cannot fail for memory alone.
        unitTests.all {
            maxHeapSize = "2g"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

afterEvaluate {
    tasks.named('preReleaseBuild').configure {
        doFirst {
            if (!orbitReleaseSigningReady) {
                throw new GradleException('Release signing is not configured. Set all four ORBIT_RELEASE_* values in the ignored orbit-signing.properties file or environment variables.')
            }
        }
    }
    tasks.named('prePlayBuild').configure {
        doFirst {
            if (!orbitUploadSigningReady) {
                logger.warn('Orbit Play bundle: no ORBIT_UPLOAD_* values are configured, so the bundle is UNSIGNED. ' +
                        'Play Console will not accept it. See docs/PLAY_STORE.md.')
            }
        }
    }
}

// The Play variant's unit tests are the Play-only checks in src/testPlay, named Play*Test. The
// shared suite in src/test describes the GitHub edition (its updater, its component installer)
// and runs as testDebugUnitTest; running it against the Play edition would fail exactly where the
// Play edition is supposed to differ.
tasks.withType(Test).configureEach {
    if (name == 'testPlayUnitTest') {
        filter.includeTestsMatching 'com.orbit.assistant.Play*Test'
    }
}


dependencies {
    implementation "androidx.core:core:1.16.0"
    implementation "androidx.work:work-runtime:2.11.2"
    implementation "androidx.media:media:1.7.0"
    implementation "com.tom-roush:pdfbox-android:2.0.27.0"
    // Smart Vault text recognition (v0.8.1.0-beta.1). The Google Play services form of ML Kit:
    // the recognition model is delivered by Play services on first use instead of being bundled
    // into every APK. Only called when the user turns on "Read text in pictures".
    implementation "com.google.android.gms:play-services-mlkit-text-recognition:19.0.1"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.16"
    androidTestImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
}
