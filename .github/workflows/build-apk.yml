name: Build GrokLink APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ groklink, main ]
  push:
    branches: [ main, groklink, offline-local ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compute GrokLink version
        id: app_version
        shell: bash
        run: |
          # Must match app/build.gradle: versionName 1.0.<run>-groklink, versionCode 1000 + run.
          echo "version=1.0.${GITHUB_RUN_NUMBER}-groklink" >> "$GITHUB_OUTPUT"

      - name: Decode stable debug keystore
        shell: bash
        run: |
          if [[ -n "${{ secrets.ORBIT_DEBUG_KEYSTORE_B64 }}" ]]; then
            echo "${{ secrets.ORBIT_DEBUG_KEYSTORE_B64 }}" | base64 -d > app/orbit-debug.keystore
          else
            base64 -d ci/orbit-debug.keystore.b64 > app/orbit-debug.keystore
          fi

      - name: Build debug APK
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Verify version and signer
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/GrokLink-${{ steps.app_version.outputs.version }}-debug.apk
          BT=$ANDROID_HOME/build-tools/35.0.0
          $BT/aapt2 dump badging "$APK" | head -n 1
          $BT/apksigner verify --print-certs "$APK" | grep -i "SHA-256"
          sha256sum "$APK"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: GrokLink-v${{ steps.app_version.outputs.version }}-debug
          path: app/build/outputs/apk/debug/GrokLink-*-debug.apk
          if-no-files-found: error
